  <style>
@import "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap";
:root{--navy:#10213d;--blue:#176beb;--blue2:#0e57c6;--sky:#eaf3ff;--paper:#fff;--bg:#f5f8fc;--line:#dfe7f1;--text:#17233a;--muted:#718096;--red:#df4b51;--orange:#e98528;--green:#178a62;--purple:#7755d9;--shadow:0 12px 36px #22497e17}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0;font-family:DM Sans,PingFang SC,sans-serif;font-size:14px}
button,input,select{font:inherit;cursor:pointer}

.app-shell{grid-template-columns:236px 1fr;min-height:100vh;display:grid}
.sidebar{color:#dce9fb;z-index:30;background:#0d1f3a;flex-direction:column;height:100vh;padding:24px 16px;display:flex;position:sticky;top:0}

.brand b{font:700 17px Manrope;display:block}
.brand span,.sidebar-foot span{color:#7891b4;margin-top:2px;font-size:11px;display:block}
.workspace{background:#122847;border:1px solid #233c60;border-radius:10px;margin-bottom:22px;padding:10px 11px;position:relative}
.workspace span{color:#718aab;text-transform:uppercase;letter-spacing:.09em;font-size:10px;display:block}
.workspace b{margin-top:3px;font-size:13px;display:block}

.sidebar nav{gap:5px;display:grid}
.sidebar nav button{color:#8fa6c4;text-align:left;background:0 0;border:0;border-radius:8px;align-items:center;gap:12px;padding:11px 13px;display:flex;width:100%}.sidebar nav button svg{width:18px;height:18px;flex:none}.sidebar nav button span{flex:1}.sidebar nav button span:first-of-type{flex:0 0 auto}
.sidebar nav button:hover{color:#fff;background:#142b4c}
.sidebar nav button.active{color:#fff;background:#176beb;box-shadow:0 7px 18px #0349b047}
.sidebar nav button span{flex:1}
.sidebar nav em{color:#fff;background:#ef5b60;border-radius:20px;padding:2px 6px;font-size:10px;font-style:normal}
.sidebar-foot{border-top:1px solid #233858;align-items:center;gap:9px;margin-top:auto;padding:18px 7px 0;display:flex}
.sidebar-foot b{font-size:12px}
.sidebar-foot small{color:#5a7aa0;font-size:9px;display:block;margin-top:1px}
.sync-dot,.live-dot{background:#29c786;border-radius:50%;width:8px;height:8px;box-shadow:0 0 0 4px #29c7861f}
main{min-width:0;position:relative}
.topbar{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20;background:#ffffffeb;align-items:center;height:68px;padding:0 34px;display:flex;position:sticky;top:0}
.topbar>div:first-of-type{gap:6px;display:flex}
.breadcrumb{color:#9aa8ba}
.top-actions{align-items:center;gap:7px;margin-left:auto;display:flex}

.unit-dropdown button:hover{background:#f1f6fd}
.unit-dropdown button.active{color:#fff;background:var(--blue)}
.unit-dropdown .u-dot{width:8px;height:8px;border-radius:50%;flex:none}
.unit-dropdown .u-label{flex:1}
.unit-dropdown .u-label b{font-size:11px;display:block}
.unit-dropdown .u-label small{color:var(--muted);font-size:9px;display:block;margin-top:1px}
.unit-dropdown button.active .u-label small{color:#ffffffb3}
.avatar{color:#1359b6;background:#dceaff;border-radius:50%;place-items:center;width:34px;height:34px;margin-left:5px;font-size:11px;font-weight:700;display:grid}
.page-wrap{max-width:1500px;margin:auto;padding:34px 38px 60px}
.page-intro{justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;display:flex}

.page-intro h1{letter-spacing:-.035em;margin:7px 0;font:800 34px/1.15 Manrope,PingFang SC}
.page-intro p{color:var(--muted);margin:0;font-size:14px}
.primary{border:1px solid #0000;border-radius:8px;justify-content:center;align-items:center;gap:8px;padding:9px 20px;font-weight:600;display:inline-flex;box-shadow:0 6px 15px #176beb30;color:#fff;background:var(--blue)}.primary,.secondary{border:1px solid #0000;border-radius:8px;justify-content:center;align-items:center;gap:8px;height:40px;padding:0 16px;font-weight:600;display:inline-flex}.primary{color:#fff;background:var(--blue);box-shadow:0 6px 15px #176beb30}.primary:hover{background:var(--blue2)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{color:var(--text);border-color:var(--line);background:#fff}.secondary:hover{background:#f8fbff;border-color:var(--line)}
.primary{color:#fff;background:var(--blue);box-shadow:0 6px 15px #176beb30}

.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{color:#33445f;border-color:var(--line);background:#fff}

.primary svg,.secondary svg{width:16px}
.time-ribbon{color:#fff;background:linear-gradient(115deg,#0c2446,#102f5c);border-radius:14px;margin-bottom:18px;padding:18px 24px 15px;box-shadow:0 15px 30px #102f5c24}
.ribbon-head{justify-content:space-between;align-items:center;font-size:12px;font-weight:600;display:flex}

.track-zone{border-top:4px solid}

.time-pin span{color:#91acd0;white-space:nowrap;font-size:10px}
.metrics{grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;display:grid}
.metric{border:1px solid var(--line);background:#fff;border-radius:11px;align-items:center;gap:14px;padding:17px;display:flex}

.metric-icon.orange{color:var(--orange);background:#fff4e9}
.metric-icon.purple{color:var(--purple);background:#f2efff}
.metric-icon.green{color:var(--green);background:#eaf8f3}
.metric-icon svg{width:19px}
.metric span,.metric small{color:var(--muted);font-size:11px;display:block}

.dashboard-grid{grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px;display:grid}
.panel{border:1px solid var(--line);background:#fff;border-radius:11px}
.panel-title{justify-content:space-between;align-items:center;padding:18px 20px 9px;display:flex}

.panel-title button{color:var(--blue);background:0 0;border:0;align-items:center;gap:5px;font-size:12px;display:flex}
.panel-title button svg{width:14px}
.chart{height:240px;padding:10px 20px 20px}
.legend{color:var(--muted);align-items:center;gap:6px;font-size:11px;display:flex}
.legend i{background:var(--blue);border-radius:2px;width:8px;height:8px}
.attention{padding-bottom:10px}
.task{background:#f8fafd;border-radius:8px;grid-template-columns:3px 1fr auto;align-items:center;gap:13px;margin:4px 18px;padding:12px;display:grid}

.task>i.orange{background:var(--orange)}
.task>i.purple{background:var(--purple)}
.task span,.task small{color:var(--muted);font-size:10px;display:block}

.task button,.row-more{color:#8a99ad;background:0 0;border:0}
.table-pane{overflow:auto;border-radius:0 0 11px 11px}
table{border-collapse:collapse;width:100%;min-width:850px}
th{text-align:left;letter-spacing:.05em;text-transform:uppercase;color:#8997aa;background:#f8fafd;border-top:1px solid #edf1f6;border-bottom:1px solid #edf1f6;padding:10px 16px;font-size:10px;font-weight:600}
td{border-bottom:1px solid #edf1f6;padding:12px 16px;font-size:12px}
tbody tr{transition:all .15s}

.badge{color:var(--blue);white-space:nowrap;background:#eaf3ff;border-radius:20px;align-items:center;gap:6px;padding:5px 8px;font-size:10px;font-weight:600;display:inline-flex}
.badge i{background:currentColor;border-radius:50%;width:6px;height:6px}
.badge.red{color:#d9424b;background:#fff0f1}
.badge.orange{color:#d87417;background:#fff3e7}
.badge.green{color:#138057;background:#eaf8f2}
.badge.purple{color:#6f4ed1;background:#f2efff}
.search{border:1px solid var(--line);background:#fff;border-radius:8px;flex:1;align-items:center;gap:8px;max-width:440px;height:40px;padding:0 12px;display:flex}
.search svg{color:#8c9caf;width:17px}
.search input{background:0 0;border:0;outline:0;width:100%}
.filter-tabs{border-bottom:1px solid var(--line);gap:24px;display:flex;overflow:auto}
.filter-tabs button{color:var(--muted);background:0 0;border:0;padding:11px 2px;position:relative;white-space:nowrap}
.filter-tabs button.active{color:var(--blue);font-weight:600}
.filter-tabs button.active:after{content:"";background:var(--blue);height:2px;position:absolute;bottom:-1px;left:0;right:0}
.rule-grid{grid-template-columns:repeat(3,1fr);gap:17px;display:grid}
.rule-card{border:1px solid var(--line);background:#fff;border-radius:11px;padding:18px;box-shadow:0 3px 8px #21416908}
.rule-card.default{border-style:dashed}
.rule-card-head{align-items:center;gap:11px;display:flex}
.rule-symbol{width:38px;height:38px;color:var(--blue);background:#eaf3ff;border-radius:8px;place-items:center;font-size:11px;font-weight:800;display:grid}
.rule-card-head>div:nth-child(2){flex:1}
.rule-card-head span{color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-size:9px}
.rule-card-head h3{margin:3px 0;font-size:14px}
.switch input{display:none}
.switch i{background:#ccd5e1;border-radius:20px;width:36px;height:20px;transition:all .2s;display:block;position:relative}
.switch i:after{content:"";background:#fff;border-radius:50%;width:16px;height:16px;transition:all .2s;position:absolute;top:2px;left:2px;box-shadow:0 1px 4px #899}
.switch input:checked+i{background:var(--blue)}
.switch input:checked+i:after{left:18px}
.rule-scope{background:#f7f9fc;border-radius:7px;margin:16px 0;padding:10px}
.rule-scope span{color:var(--muted);font-size:9px;display:block}
.rule-scope b{font-size:11px}
.rule-timing{grid-template-columns:1fr 1fr;gap:8px;display:grid}
.rule-timing>div{border:1px solid #e7edf4;border-radius:7px;gap:8px;padding:10px;display:flex}
.rule-timing svg{width:15px;color:var(--blue);flex:none}
.rule-timing span{color:var(--muted);font-size:9px}
.rule-timing b{color:var(--text);margin-top:3px;font-size:11px;display:block}
.rule-levels{border-bottom:1px solid var(--line);gap:12px;padding:17px 0;display:flex}
.rule-levels span{color:#62728a;align-items:center;gap:5px;font-size:9px;display:flex}
.rule-levels i{background:var(--blue);border-radius:50%;width:7px;height:7px}
.rule-levels i.orange{background:var(--orange)}
.rule-levels i.red{background:var(--red)}
.rule-card footer{color:var(--muted);justify-content:space-between;align-items:center;padding-top:13px;font-size:9px;display:flex}
.rule-card footer button{color:var(--blue);background:0 0;border:0;gap:5px;font-size:10px;display:flex}
.rule-grid{grid-template-columns:repeat(3,1fr);gap:17px;display:grid}
.arch-card{border:1px solid var(--line);background:#fff;border-radius:11px;overflow:hidden}
.arch-diagram{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--line);min-height:180px}
.arch-layer{padding:24px 20px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.arch-layer:last-child{border:0}
.arch-layer .layer-symbol{width:32px;height:32px;margin:0 auto 10px;border-radius:8px;place-items:center;display:grid}
.arch-layer .layer-symbol svg{width:16px}
.arch-layer h4{margin:0 0 4px;font-size:12px;font-weight:700}
.arch-layer p{color:var(--muted);margin:0;font-size:9px;line-height:1.5}
.arch-connector-row{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap}
.conn-chip{border:1px solid var(--line);border-radius:20px;align-items:center;gap:5px;padding:5px 10px;font-size:9px;font-weight:600;display:inline-flex;background:#f8fafd}
.conn-chip .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.conn-chip .dot.green{background:var(--green)}
.conn-chip .dot.blue{background:var(--blue)}
.conn-chip .dot.orange{background:var(--orange)}
.arch-units{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}
.unit-card{border:1px solid var(--line);border-radius:11px;padding:18px;text-align:center;transition:all .15s;cursor:pointer}
.unit-card:hover{border-color:var(--blue);box-shadow:0 4px 12px #176beb18}
.unit-card.active{background:var(--sky);border-color:var(--blue)}
.unit-card .u-badge{width:36px;height:36px;border-radius:8px;margin:0 auto 8px;place-items:center;display:grid;font-size:12px;font-weight:800}
.unit-card h4{margin:0;font-size:13px}
.unit-card p{color:var(--muted);margin:4px 0 0;font-size:9px;line-height:1.4}

.connector-card .units span{background:#f3f6fa;color:#4a5a72;border-radius:4px;padding:2px 6px;font-size:8px}
.flow-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:0;margin:20px 0;padding:0 10px}
.flow-box{border:1px solid var(--line);border-radius:8px;padding:14px 12px;text-align:center;background:#fafcff}
.flow-box .f-icon{height:24px;margin-bottom:4px;place-items:center;display:grid}
.flow-box .f-icon svg{width:18px;color:var(--muted)}
.flow-box b{font-size:10px;display:block}
.flow-box small{color:var(--muted);font-size:8px;display:block;margin-top:2px}
.flow-arrow{color:#bcc9db;font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:300}
.drawer{background:#fff;flex-direction:column;width:min(520px,100vw);display:flex;position:absolute;top:0;bottom:0;right:0;box-shadow:-15px 0 50px #091c372e}
.drawer.open{display:flex}
.drawer-head{border-bottom:1px solid var(--line);align-items:center;gap:10px;height:65px;padding:0 20px;display:flex}
.drawer-head .close-btn{color:var(--muted);background:0 0;border:0;margin-left:auto;font-size:18px;cursor:pointer}
.drawer-body{padding:22px 28px;overflow:auto;flex:1}
.drawer-body .info{margin-bottom:16px}
.drawer-body .info span{color:var(--muted);font-size:10px;display:block;margin-bottom:2px}
.drawer-body .info b{font-size:12px}
.info-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.api-spec{background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.6;overflow:auto;max-height:260px}
.api-spec .key{color:var(--blue)}
.api-spec .string{color:var(--green)}
.hidden{display:none!important}
.toast{color:#fff;z-index:100;background:#10233f;border-radius:9px;align-items:center;gap:9px;padding:13px 18px;font-size:12px;animation:.25s toastIn;display:flex;position:fixed;bottom:25px;right:26px;box-shadow:0 10px 30px #0a1f3d40}
.toast svg{width:17px;color:#4cd49c;flex:none}
@keyframes toastIn{0%{opacity:0;transform:translateY(10px)}}
.mono{color:#42526b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rule-impact-note{color:#3e5878;background:#eef6ff;border:1px solid #d2e4fa;border-radius:9px;align-items:center;gap:11px;margin-bottom:14px;padding:12px 16px;display:flex}
.rule-impact-note svg{width:19px;color:var(--blue);flex:none}
.rule-impact-note b,.rule-impact-note span{display:block}
.rule-impact-note b{font-size:11px}
.rule-impact-note span{color:#6b7e96;margin-top:2px;font-size:10px}
.file-box{border:1px solid var(--line);border-radius:8px;align-items:center;gap:10px;padding:12px;display:flex;margin-top:18px}
.file-box svg{color:var(--blue);width:18px;flex:none}
.file-box div{flex:1}
.file-box b,.file-box span{font-size:10px;display:block}
.file-box span{color:var(--muted);margin-top:3px}
.file-box button{color:var(--blue);background:0 0;border:0}
.timeline{padding:25px 35px}
.timeline>div{border-left:1px solid #d6e1ee;padding:0 0 15px 16px;position:relative}
.timeline i{background:var(--blue);border-radius:50%;width:9px;height:9px;position:absolute;top:4px;left:-5px}
.timeline span,.timeline small{color:var(--muted);font-size:10px;display:block}
.timeline b{margin:4px 0;font-size:12px;display:block}
.mobile-menu{display:none}

<div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${d.events.slice(0,4).map(e=>`<span class="badge" style="font-size:10px;padding:6px 12px">${e.name}</span>`).join('')}</div></div></div>`;
}

function archive() {
  const d = data(), u = UNITS.find(x=>x.id===curUnit);
  return `<div class="page-intro"><div><span>${u.name} · ARCHIVE WORKBENCH</span><h1>归档工作台</h1><p>组卷、签章、审计导出，一键生成合规案卷。</p></div><button class="primary" onclick="t('案卷生成中...')">${I.plus} 新建案卷</button></div>
<div class="dashboard-grid"><div class="panel" style="padding:20px"><h3 style="margin:0 0 14px;font-size:14px">待归档案卷</h3>${d.events.filter(e=>e.status!=='已归档').map(e=>`<div class="task" style="margin:4px 0"><i style="background:var(--orange)"></i><div><span>${e.date}</span><b>${e.name}</b><small>责任人：${e.person}</small></div><button class="primary" style="height:30px;padding:0 12px;font-size:10px">组卷</button></div>`).join('')}</div>
<div class="panel" style="padding:20px"><h3 style="margin:0 0 14px;font-size:14px">已归档案卷</h3>${d.events.filter(e=>e.status==='已归档').map(e=>`<div class="task" style="margin:4px 0"><i style="background:var(--green)"></i><div><span>${e.date}</span><b>${e.name}</b><small>案卷号：ARC-${e.id}</small></div><button class="secondary" style="height:30px;padding:0 12px;font-size:10px">查看</button></div>`).join('')||'<p style="color:var(--muted);text-align:center;padding:30px 0">暂无已归档案卷</p>'}</div></div>`;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function monitoring() {
  const d = data(), u = UNITS.find(x=>x.id===curUnit), m = d.monitoring, a = m.today_alerts;
  const total = a.fighting + a.lingering + a.climbing + a.fall + a.fence;
  const beh = [
    ['打架斗殴','fighting','red',I.alert],['滞留危险区','lingering','orange',I.clock],
    ['攀爬窗/围栏','climbing','red',I.alert],['倒地/晕厥','fall','red',I.alert],
    ['越界/区域离开','fence','orange',I.location],
  ];
  const ch = [
    {icon:I.alert,name:'弹框提醒',desc:'实时视频画面+告警信息弹框',k:'popup',color:'var(--blue)'},
    {icon:I.speaker,name:'音响预警',desc:'外接音响播放提示音',k:'speaker',color:'var(--orange)'},
    {icon:I.mobile,name:'APP推送',desc:'实时接收权限内告警事件',k:'app',color:'var(--green)'},
    {icon:I.plug,name:'API联动',desc:'主动推送联动第三方平台',k:'api',color:'var(--purple)'},
  ];
  return `<div class="page-intro"><div><span>${u.name} · AI MONITORING</span><h1>AI 监控预警</h1><p>基于AI行为分析(打架/滞留/攀爬/倒地/越界) + 4通道告警联动。</p></div><button class="secondary" onclick="t('告警联动测试已触发')">${I.speaker} 测试告警联动</button></div>
<div class="metrics">${m2('摄像头路数',m.cameras,'实时监控','blue')}${m2('今日告警',total,'AI行为识别','orange')}${m2('弹框提醒',m.channels.popup?'已开启':'已关闭','桌面端','purple')}${m2('音响/APP/API',[m.channels.speaker,m.channels.app,m.channels.api].filter(Boolean).length+'/3','联动通道','green')}</div>
<div class="dashboard-grid"><div class="panel"><div class="panel-title"><div><span>BEHAVIOR RECOGNITION</span><h2>AI 行为识别（今日）</h2></div></div>
<div style="padding:10px 20px 20px">${beh.map(b=>`<div class="task" style="margin:4px 0"><i style="background:${b[2]==='red'?'var(--red)':'var(--orange)'}"></i><div><span>${b[0]}</span><b>${a[b[1]]} 次</b><small>${a[b[1]]>0?'已触发告警':'正常'}</small></div><button class="badge ${a[b[1]]>0?'red':'green'}" style="font-size:10px">${a[b[1]]>0?'查看':'正常'}</button></div>`).join('')}</div></div>
<div class="panel"><div class="panel-title"><div><span>ALERT CHANNELS</span><h2>4 通道告警联动</h2></div></div>
<div style="padding:10px 20px 20px"><div class="connector-grid" style="grid-template-columns:1fr 1fr">${ch.map(c=>`<div class="connector-card" style="padding:14px"><div class="c-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div><h4>${c.name}</h4><p>${c.desc}</p><span class="protocol" style="background:${m.channels[c.k]?c.color+'22':''};color:${m.channels[c.k]?c.color:'var(--muted)'}">${m.channels[c.k]?'● 已启用':'○ 未启用'}</span></div>`).join('')}</div></div></div></div>`;
}

function tracking() {
  const d = data(), u = UNITS.find(x=>x.id===curUnit), t = d.tracking;
  const hasTrack = t.persons > 0;
  const zones = [
    {zone:'三监区',count:124,color:'var(--blue)'},{zone:'放风区',count:56,color:'var(--green)'},
    {zone:'食堂',count:89,color:'var(--orange)'},{zone:'医疗楼',count:23,color:'var(--purple)'},
    {zone:'劳动车间',count:312,color:'var(--muted)'},{zone:'隔离区',count:2,color:'var(--red)'},
  ];
  const evts = [
    {t:'09:12',title:'越界告警 · 三监区',desc:'犯人HZ-2026-183 离开2米范围',cls:'red',lbl:'已触发'},
    {t:'08:45',title:'滞留告警 · 劳动车间',desc:'犯人HZ-2026-091 滞留超5分钟',cls:'orange',lbl:'处理中'},
    {t:'07:30',title:'区域接触告警',desc:'犯人HZ-2026-137 与HZ-2026-042 近距离接触',cls:'orange',lbl:'待确认'},
    {t:'06:50',title:'出操点名完成',desc:'应到312人，实到312人，人脸识别全部通过',cls:'green',lbl:'已完成'},
  ];
  return `<div class="page-intro"><div><span>${u.name} · PERSONNEL TRACKING</span><h1>人员轨迹 & 区域管控</h1><p>电子手环定位 · 轨迹追踪 · 电子围栏 · 点名签到 · 接触分析</p></div><button class="secondary" onclick="t('轨迹数据已刷新')">${I.refresh} 刷新定位</button></div>
${hasTrack?`
<div class="metrics">${m2('在押人员',t.persons,'电子手环佩戴','blue')}${m2('活跃设备',t.active_devices,'在线率'+(t.persons>0?Math.round(t.active_devices/t.persons*100):0)+'%','green')}${m2('管控区域',t.zones,'电子围栏','orange')}${m2('今日轨迹记录',t.active_devices*12,'条/小时','purple')}</div>
<div class="dashboard-grid"><div class="panel"><div class="panel-title"><div><span>REAL-TIME POSITIONING</span><h2>实时定位分布</h2></div></div>
<div style="padding:14px 20px 20px"><div class="rule-grid" style="grid-template-columns:repeat(2,1fr)">${zones.map(z=>'<div class="task" style="margin:4px 0;grid-template-columns:3px 1fr"><i style="background:'+z.color+'"></i><div><span>'+z.zone+'</span><b>'+z.count+' 人</b><small>手环定位在线</small></div></div>').join('')}</div></div></div>
<div class="panel"><div class="panel-title"><div><span>GEOFENCE EVENTS</span><h2>电子围栏事件</h2></div></div>
<div style="padding:10px 20px 20px">${evts.map(e=>'<div class="task" style="margin:4px 0"><i style="background:var(--'+e.cls+')"></i><div><span>2026-08-22 '+e.t+'</span><b>'+e.title+'</b><small>'+e.desc+'</small></div><button class="badge '+e.cls+'" style="font-size:10px">'+e.lbl+'</button></div>').join('')}</div></div></div>
`:`
<div class="panel" style="min-height:300px;display:grid;place-items:center"><div style="text-align:center;padding:40px"><div class="brand-mark" style="width:48px;height:48px;margin:0 auto 12px;font-size:18px">${I.location}</div><h3 style="margin:0 0 6px">${u.name} · 人员轨迹</h3><p style="color:var(--muted);font-size:12px;max-width:450px;margin:0 auto">当前单位未部署人员定位设备。<br>切换到「监狱」单位查看电子手环、区域管控、轨迹追踪功能。</p></div></div>
`}</div>`;
}

function m2(l,v,n,t) {
  return `<div class="metric"><div class="metric-icon${t!=='blue'?' '+t:''}">${I.eye}</div><div><span>${l}</span><strong>${v}</strong><small>${n}</small></div></div>`;
}
function curUnitName() { return UNITS.find(x=>x.id===curUnit).name; }
function data() { return UNIT_DATA[curUnit]; }
function m(label,val,note,tone) { return `<div class="metric"><div class="metric-icon${tone!=='blue'?' '+tone:''}">${I.layer1}</div><div><span>${label}</span><strong>${val}</strong><small>${note}</small></div></div>`; }
function chart(d) { const m=Math.max(...d,1); return `<div style="display:flex;align-items:flex-end;height:200px;padding:0 10px">${d.map((v,i)=>{const h=(v/m)*100;return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:180px"><div style="width:24px;height:${h}%;background:${i===1?'#176BEB':'#C9DCFA'};border-radius:5px 5px 0 0;transition:all .3s;min-height:${v>0?4:0}px"></div><span style="color:var(--muted);font-size:10px;margin-top:6px">${['9月','10月','11月','12月','1月','2月'][i]}</span></div>`;}).join('')}</div>`; }

function sd(id) {
  const d = data(), e = d.events.find(x=>x.id===id);
  if(!e)return;
  const el = document.createElement('div'); el.className='drawer open';
  el.innerHTML=`<div class="drawer-head"><b>事件详情</b><button class="close-btn" onclick="this.closest('.drawer').remove()">&times;</button></div>
<div class="drawer-body"><div class="info"><span>事件名称</span><b>${e.name}</b></div><div class="info-pair"><div class="info"><span>事件编号</span><b>${e.id}</b></div><div class="info"><span>类型</span><b>${e.type}</b></div></div><div class="info-pair"><div class="info"><span>责任人</span><b>${e.person}</b></div><div class="info"><span>时间</span><b>${e.date}</b></div></div><div class="info"><span>状态</span><b>${e.status}</b></div><div class="info"><span>冲突检测</span><b>${e.conflict>0?`${I.alert} ${e.conflict} 项法规冲突待处理`:`${I.check} 无冲突`}</b></div>
<div class="info" style="margin-top:16px"><span>关联证据</span></div>
<div class="file-box">${I.file}<div><b>证据材料.pdf</b><span>2.4 MB · 上传于 ${e.date}</span></div><button>${I.layer1} 预览</button></div>
<div class="info" style="margin-top:16px"><span>操作记录</span></div>
<div class="timeline"><div><i></i><span>${e.date} 14:00</span><b>事件录入</b><small>AI自动识别并入库</small></div><div><i style="background:var(--orange)"></i><span>${e.date} 14:05</span><b>法规校对完成</b><small>${e.conflict}项冲突标记</small></div></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
}

function ts() { sidebarOpen=!sidebarOpen; r(); }
function td() { document.getElementById('unitDd')?.classList.toggle('hidden'); }
function su(id) { curUnit=id; curPage='overview'; r(); }
function sp(id) { curPage=id; if(window.innerWidth<=760)sidebarOpen=false; r(); }
function t(msg) { const el=document.createElement('div'); el.className='toast'; el.innerHTML=`${I.check} ${msg}`; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }

function attach() {
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>sp(b.dataset.page)));
  document.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();su(b.dataset.unit);document.getElementById('unitDd')?.classList.add('hidden');}));
  document.addEventListener('click',e=>{if(!e.target.closest('.unit-btn'))document.getElementById('unitDd')?.classList.add('hidden');});
}
r();
</script>
</body>
</html>
